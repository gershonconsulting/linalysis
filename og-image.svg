<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FE1B04" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FE1B04" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo -->
  <g transform="translate(80, 80)">
    <rect width="70" height="70" rx="14" fill="#FE1B04"/>
    <g stroke="#fff" stroke-width="6" stroke-linecap="round">
      <line x1="17" y1="54" x2="17" y2="38"/>
      <line x1="29" y1="54" x2="29" y2="22"/>
      <line x1="41" y1="54" x2="41" y2="30"/>
      <line x1="53" y1="54" x2="53" y2="44"/>
    </g>
  </g>
  <text x="170" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#FE1B04" letter-spacing="-1">Linalysis</text>
  <text x="170" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#6e6e73" letter-spacing="2" text-transform="uppercase">LINKEDIN ANALYTICS</text>

  <!-- Headline -->
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#1d1d1f" letter-spacing="-2">LinkedIn analytics</text>
  <text x="80" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#FE1B04" letter-spacing="-2">that actually matter.</text>

  <text x="80" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#6e6e73">Track connections, SSI, profile views, and company performance —</text>
  <text x="80" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#6e6e73">for years, not weeks. With AI insights.</text>

  <!-- Chart at bottom -->
  <g transform="translate(80, 510)">
    <path d="M 0,80 C 100,75 180,50 280,55 S 500,25 640,35 S 900,10 1040,18 L 1040,100 L 0,100 Z" fill="url(#chart)"/>
    <path d="M 0,80 C 100,75 180,50 280,55 S 500,25 640,35 S 900,10 1040,18" stroke="#FE1B04" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Stat markers -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="900" y="140" font-size="52" font-weight="800" fill="#FE1B04" text-anchor="end">29,355</text>
    <text x="900" y="170" font-size="14" fill="#6e6e73" text-anchor="end">CONNECTIONS · +60% / 5 YRS</text>
    <text x="1120" y="260" font-size="36" font-weight="800" fill="#1d1d1f" text-anchor="end">SSI 70</text>
    <text x="1120" y="285" font-size="13" fill="#6e6e73" text-anchor="end">TOP 1% INDUSTRY &amp; NETWORK</text>
  </g>
</svg>
