  <text x="210" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#FE1B04" letter-spacing="-2">Linalysis</text>
  <text x="210" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#6e6e73" letter-spacing="3">LINKEDIN ANALYTICS</text>
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#1d1d1f" letter-spacing="-2">LinkedIn analytics</text>
  <text x="80" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#FE1B04" letter-spacing="-2">that actually matter.</text>
