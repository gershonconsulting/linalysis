      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FE1B04" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FE1B04" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="logo-shine" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ff4a30"/>
      <stop offset="100%" stop-color="#FE1B04"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80, 70)">
    <circle cx="60" cy="60" r="60" fill="url(#logo-shine)"/>
    <g fill="#fff">
      <rect x="35" y="65" width="12" height="30" rx="2"/>
      <rect x="54" y="45" width="12" height="50" rx="2"/>
      <rect x="73" y="55" width="12" height="40" rx="2"/>
