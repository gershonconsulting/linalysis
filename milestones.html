<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linalysis — Milestones & Streaks</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/common.css" />
<style>
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .timeline { position: relative; padding-left: 30px; margin-top: 20px; }
  .timeline::before { content: ''; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
  .ms-item { position: relative; padding: 12px 0 20px; }
  .ms-item::before { content: ''; position: absolute; left: -28px; top: 17px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); border: 4px solid #fff; box-shadow: 0 0 0 2px var(--brand); }
  .ms-item.big::before { background: #D4AF37; box-shadow: 0 0 0 2px #D4AF37; }
  .ms-date { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .ms-title { font-size: 15px; font-weight: 800; margin-top: 4px; }
  .ms-body { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .badge { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 16px; text-align: center; position: relative; }
  .badge.earned { border-color: #D4AF37; background: linear-gradient(180deg, #fffdf5, #fff9e6); }
  .badge.locked { opacity: 0.4; }
  .badge-icon { font-size: 36px; margin-bottom: 8px; }
  .badge-title { font-size: 13px; font-weight: 800; }
  .badge-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
  .badge-date { position: absolute; top: 8px; right: 10px; font-size: 9px; color: var(--text-muted); }

  .section-spacer { height: 30px; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar" data-active="milestones"></aside>
<main>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="menu-toggle btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Menu">☰</button>
    <h1>Milestones & Streaks</h1>
  </div>
  <div class="topbar-right">
    <span class="avatar" title="Olivier">O</span>
  </div>
</div>

<div class="content">
  <div class="page-header">
    <h2 id="hero-title">Your milestones</h2>
    <p>Every milestone you've crossed, every streak you're on, every record you hold. Share-worthy moments from your LinkedIn journey.</p>
  </div>
  <script>
  // Fill the hero title from real capture counts once data.js has loaded.
  (function() {
    var d = window.LINALYSIS_DATA;
    var days = d && d.dates ? d.dates.length : 0;
    if (days === 0) return; // first-time-guard.js replaces the whole content anyway
    var years = Math.floor(days / 365);
    var el = document.getElementById('hero-title');
    if (!el) return;
    if (years >= 1) {
      el.textContent = years + ' year' + (years === 1 ? '' : 's') + '. ' + days.toLocaleString() + ' days tracked.';
    } else {
      el.textContent = days.toLocaleString() + ' days tracked and counting.';
    }
  })();
  </script>

  <div class="stat-strip" id="stats"></div>

  <div class="section-title">Active streaks</div>
  <div class="grid cols-2" id="streaks"></div>

  <div class="section-spacer"></div>

  <div class="section-title">Personal records</div>
  <div class="grid cols-3" id="records"></div>

  <div class="section-spacer"></div>

  <div class="section-title">Badges earned</div>
  <div class="badge-grid" id="badges"></div>

  <div class="section-spacer"></div>

  <div class="section-title">Milestone timeline</div>
  <div class="card" style="padding:20px 30px">
    <div class="timeline" id="timeline"></div>
  </div>

</div>
</main></div>

<div id="toast"></div>
<script src="/data.js"></script>
<script src="/live-data.js"></script>
<script src="/first-time-guard.js"></script>
<script src="/plan.js"></script>
<script src="/stats-helpers.js"></script>
<script src="/api.js"></script>
<script src="/nav.js" defer></script>
<script>
const fmt = n => typeof n === 'number' ? n.toLocaleString('en-US') : n;
const fmtDate = ymd => new Date(ymd + 'T00:00:00Z').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

(function() {
  const D = window.LINALYSIS_DATA;
  // Top strip
  const ttl = Stats.latest('connections');
  const first = Stats.firstDate();
  const days = D.dates.length;
  const ssiCur = Stats.latest('ssi');
  const ssiHigh = Stats.bestEver('ssi').max.value;
  const bestJump = Stats.biggestJump('connections');
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Days tracked</div><div class="stat-value">${fmt(days)}</div><div class="stat-sub">since ${fmtDate(first)}</div></div>
    <div class="stat-card"><div class="stat-label">Connections</div><div class="stat-value">${fmt(ttl)}</div><div class="stat-sub">+${fmt(ttl - Stats.series('connections')[0])} since day one</div></div>
    <div class="stat-card"><div class="stat-label">Current SSI</div><div class="stat-value">${ssiCur}</div><div class="stat-sub">All-time high: ${ssiHigh}</div></div>
    <div class="stat-card"><div class="stat-label">Best single day</div><div class="stat-value">+${fmt(bestJump.delta)}</div><div class="stat-sub">${fmtDate(bestJump.date)}</div></div>
  `;

  // Streaks
  const keys = ['connections', 'ssi', 'co_followers'];
  document.getElementById('streaks').innerHTML = keys.map(k => {
    const cur = Stats.currentStreak(k);
    const longest = Stats.longestStreak(k);
    return `
      <div class="card" style="padding:20px 24px">
        <div class="stat-label">${Stats.METRICS[k].label}</div>
        <div style="display:flex;gap:30px;margin-top:8px">
          <div>
            <div style="font-size:26px;font-weight:800;color:var(--brand)">${cur.days} days</div>
            <div style="font-size:12px;color:var(--text-muted)">current streak</div>
          </div>
          <div>
            <div style="font-size:26px;font-weight:800">${longest.days} days</div>
            <div style="font-size:12px;color:var(--text-muted)">all-time record (${fmtDate(longest.from)})</div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Records
  const recMetrics = ['connections', 'ssi', 'views', 'co_followers', 'co_impressions', 'search_appearance'];
  document.getElementById('records').innerHTML = recMetrics.map(k => {
    const best = Stats.bestEver(k);
    return `
      <div class="card" style="padding:20px 24px">
        <div class="stat-label">${Stats.METRICS[k].label}</div>
        <div class="stat-value">${fmt(best.max.value)}</div>
        <div class="stat-sub">Peaked ${fmtDate(best.max.date)}</div>
      </div>
    `;
  }).join('');

  // Badges
  const badges = [
    { id: 'first_100',   icon: '🌱', title: 'First 100',      desc: '100+ connections',    check: () => Stats.series('connections').some(v => v >= 100),   dateKey: 'connections', threshold: 100 },
    { id: 'first_1k',    icon: '🚀', title: 'First 1,000',    desc: '1,000+ connections',  check: () => Stats.series('connections').some(v => v >= 1000),  dateKey: 'connections', threshold: 1000 },
    { id: 'first_10k',   icon: '💎', title: '10K Club',       desc: '10,000+ connections', check: () => Stats.series('connections').some(v => v >= 10000), dateKey: 'connections', threshold: 10000 },
    { id: 'first_25k',   icon: '🏆', title: '25K Hero',       desc: '25,000+ connections', check: () => Stats.series('connections').some(v => v >= 25000), dateKey: 'connections', threshold: 25000 },
    { id: 'first_50k',   icon: '👑', title: '50K Legend',     desc: '50,000+ connections', check: () => Stats.series('connections').some(v => v >= 50000), dateKey: 'connections', threshold: 50000 },
    { id: 'ssi_70',      icon: '📊', title: 'SSI 70+',        desc: 'Reach SSI 70',        check: () => Stats.series('ssi').some(v => v >= 70),  dateKey: 'ssi', threshold: 70 },
    { id: 'ssi_80',      icon: '⭐', title: 'SSI 80+',        desc: 'Reach SSI 80',        check: () => Stats.series('ssi').some(v => v >= 80),  dateKey: 'ssi', threshold: 80 },
    { id: 'year_1',      icon: '🎂', title: '1-year veteran', desc: '365 days of tracking',check: () => Stats.dates().length >= 365,  dateKey: null },
    { id: 'year_5',      icon: '🌟', title: '5-year veteran', desc: '1,825 days tracked',  check: () => Stats.dates().length >= 1825, dateKey: null },
    { id: 'streak_30',   icon: '🔥', title: '30-day streak',  desc: 'No decline for 30 days', check: () => Stats.longestStreak('connections').days >= 30, dateKey: null },
    { id: 'streak_100',  icon: '💪', title: '100-day streak', desc: 'No decline for 100 days',check: () => Stats.longestStreak('connections').days >= 100,dateKey: null },
    { id: 'co_1k',       icon: '🏢', title: 'Company 1K',     desc: '1K company followers',check: () => Stats.series('co_followers').some(v => v >= 1000), dateKey: 'co_followers', threshold: 1000 },
  ];
  document.getElementById('badges').innerHTML = badges.map(b => {
    const earned = b.check();
    let when = '';
    if (earned && b.dateKey && b.threshold) {
      const s = Stats.series(b.dateKey);
      const ds = Stats.dates();
      for (let i = 0; i < s.length; i++) { if (s[i] >= b.threshold) { when = fmtDate(ds[i]); break; } }
    }
    return `
      <div class="badge ${earned ? 'earned' : 'locked'}">
        ${when ? `<div class="badge-date">${when}</div>` : ''}
        <div class="badge-icon">${b.icon}</div>
        <div class="badge-title">${b.title}</div>
        <div class="badge-desc">${b.desc}</div>
      </div>
    `;
  }).join('');

  // Timeline of every 5K milestone + SSI milestones
  const connMs = Stats.milestonesCrossed('connections', 5000);
  const ssiMs = [60, 65, 70, 75, 80, 85, 90].map(t => {
    const s = Stats.series('ssi'), ds = Stats.dates();
    for (let i = 0; i < s.length; i++) if (s[i] >= t) return { date: ds[i], kind: 'ssi', target: t };
    return null;
  }).filter(Boolean);
  const items = [
    ...connMs.map(m => ({ date: m.date, title: `Crossed ${fmt(m.value)} connections`, body: `Your network reached ${fmt(m.value)} — that's a lot of new inbox noise.`, big: m.value % 10000 === 0 })),
    ...ssiMs.map(m  => ({ date: m.date, title: `SSI reached ${m.target}`, body: `A solid marker — top-tier SSI territory.`, big: m.target >= 80 })),
  ].sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById('timeline').innerHTML = items.length
    ? items.map(i => `
        <div class="ms-item ${i.big ? 'big' : ''}">
          <div class="ms-date">${fmtDate(i.date)}</div>
          <div class="ms-title">${i.title}</div>
          <div class="ms-body">${i.body}</div>
        </div>`).join('')
    : '<div style="color:var(--text-muted)">No milestones crossed yet — keep going!</div>';
})();
</script>
</body>
</html>
